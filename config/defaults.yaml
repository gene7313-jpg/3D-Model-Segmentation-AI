domain: mechanical  # mechanical | organic (organic track later)
printer_profile: bambu_p1s
units: mm
# Mechanical defaults
mechanical:
  min_wall_mm: 1.2
  pin_diameter_mm: 3.0
  pin_clearance_mm: 0.2
  prefer_planar_registers: true
# Contoured cut defaults
cut:
  surface_samples: 64
  fill_caps: true
# Sibling trellis-mac (Phase C) — generation stays in that venv
trellis:
  root: ../trellis-mac
  pipeline_type: "512"
  texture_size: 1024
  seed: 42
  target_longest_mm: 120.0
# Organic cut track (Phase D) — aesthetic mid-plane seams, not mechanical pins
organic_cut:
  max_splits: 3
  strategy: longest_axis_midplane
